# Sim-to-real noise-augmented K41144 Wave2 instance segmentation config.
# Use this as an experiment against the clean Wave2 model, not as the default.
# The first real reference file inspected was real-data/scene_001.pcd:
# - PCD coordinates are mm-like and must be scaled by 0.001 before real-eval.
# - xy nearest-neighbor spacing is about 0.6-1.1 mm.
# - about 20% of sampled points sit near >5 mm local depth discontinuities.
# These values support strong edge/dropout simulation, especially for adjacent
# parts whose depth edges visually merge in real captures.
seed: 7

dataset:
  root: processed-data/pointnet2_semseg_k41144_wave2
  normalize: scene_center
  min_points_per_instance: 16
  augment:
    enabled: true
    xyz_jitter_std: 0.0005
    xyz_jitter_clip: 0.002
    depth_noise_std: 0.0007
    point_dropout_prob: 0.03
    outlier_ratio: 0.002
    outlier_std: 0.015
    normal_jitter_std: 0.02
    random_z_rotation: false
    # Structured-light / real-depth gap terms.
    depth_quadratic_noise: 0.004
    depth_quantization_m: 0.001
    incidence_dropout_max_prob: 0.30
    incidence_dropout_power: 3.0
    edge_dropout_prob: 0.45
    edge_dropout_neighbors: 8
    edge_dropout_gap_m: 0.005
    blob_dropout_count: 3
    blob_dropout_radius_m: 0.010
    camera_fallback_standoff_m: 0.6

model:
  name: pointnet2_instance_seg
  num_classes: 2
  input_features: xyz_normal
  ops_backend: pytorch3d
  sa_npoints: [1024, 256, 64]
  sa_nsamples: [32, 32, 32]
  dropout: 0.2
  embedding_dim: 8

loss:
  semantic_weight: 1.0
  offset_weight: 5.0
  embedding_weight: 0.0
  offset_smooth_l1_beta: 0.01
  delta_var: 0.5
  delta_dist: 1.5
  regularization_weight: 0.001
  min_points_per_instance: 16
  centroid_distance_weighting: false
  centroid_distance_weight_min: 0.5
  centroid_distance_weight_max: 1.5

inference:
  object_probability_threshold: 0.5
  dbscan_eps_m: 0.004
  dbscan_eps_sweep_m: [0.004, 0.005, 0.006, 0.007, 0.008, 0.010, 0.012]
  dbscan_min_samples: 8
  min_cluster_points: 96

metrics:
  instance_iou_threshold: 0.5
  ignore_gt_instances_below_points: 32
  merge_split_overlap_threshold: 0.1

train:
  seed: 7
  device: cuda
  num_workers: 0
  epochs: 50
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weight_mode: auto
